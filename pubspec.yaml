name: gerisayim
description: "Geri Sayım Uygulaması"
version: 1.0.5+5
publish_to: 'none'

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # FIREBASE
  firebase_core: ^3.6.0
  firebase_auth: ^5.1.0 
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0

  # ADS
  google_mobile_ads: ^5.1.0

  # STORAGE & DEVICE
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.0
  path_provider: ^2.1.5

  # NOTIFICATION
  flutter_local_notifications: ^17.1.2

  # SHARE
  share_plus: ^12.0.2

  # AUDIO & EFFECT
  audioplayers: ^6.6.0
  torch_light: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter_native_splash:
  color: "#000000"
  image: assets/icon/logosplash3.png
  android_gravity: center
  ios: true
  fullscreen: true
  android_12:
    image: assets/icon/logosplash3.png
    color: "#000000" 
    icon_background_color: "#000000"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700